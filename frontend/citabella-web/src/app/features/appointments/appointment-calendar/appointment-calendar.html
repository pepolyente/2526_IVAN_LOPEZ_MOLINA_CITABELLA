<div class="calendar-page">

  <div class="page-header">
    <div class="page-header-left">
      <h2>Agenda de citas</h2>
    </div>
    <div class="legend">
  <span class="legend-item">
    <span class="legend-dot" style="background:#F59E0B"></span> Pendiente
  </span>
      <span class="legend-item">
    <span class="legend-dot" style="background:#3B82F6"></span> Confirmada
  </span>
      <span class="legend-item">
    <span class="legend-dot" style="background:#8B5CF6"></span> En progreso
  </span>
      <span class="legend-item">
    <span class="legend-dot" style="background:#10B981"></span> Completada
  </span>
      <span class="legend-item">
    <span class="legend-dot" style="background:#EF4444"></span> Cancelada
  </span>
      <span class="legend-item">
    <span class="legend-dot" style="background:#6B7280"></span> No show
  </span>
    </div>
    <div class="page-header-actions">
      <a routerLink="new"  class="btn-primary">+ Nueva cita</a>
    </div>
  </div>
  <div class="filters-bar">
    <div class="filter-group">
      <label>Filtrar por estado</label>
      <select [(ngModel)]="filterStatus" (change)="applyFilter()">
        <option value="">Todos</option>
        @for (status of statuses; track status) { <option [value]="status">{{ status }}</option> }
      </select>
    </div>
  </div>
  <div class="calendar-wrapper">
    <full-calendar [options]="calendarOptions"></full-calendar>
  </div>

  @if (showDetailModal && selectedAppointment) {
    <app-appointment-modal
      [appointment]="selectedAppointment"
      (close)="closeDetailModal()"
      (updated)="onAppointmentUpdated()">
    </app-appointment-modal>
  }

  @if (showCreateModal && selectedSlot) {
    <app-appointment-create-modal
      [initialStart]="selectedSlot.start"
      [initialEnd]="selectedSlot.end"
      (close)="closeCreateModal()"
      (created)="onAppointmentCreated()">
    </app-appointment-create-modal>
  }

</div>

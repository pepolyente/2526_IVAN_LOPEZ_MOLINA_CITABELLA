<div class="auth-wrapper">
  <div class="auth-card">

    <a routerLink="/" class="auth-back-link">← Volver al inicio</a>

    <div class="auth-logo">
      <img src="/images/logoRedondo.png" alt="CitaBella" height="56">
      <h1>CitaBella</h1>
    </div>

    <h2 class="auth-title">Crear cuenta</h2>
    <p class="auth-sub">Regístrate para gestionar tus citas</p>

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input id="username"
               type="text"
               [(ngModel)]="data.username"
               name="username"
               required
               placeholder="Nombre de usuario"
               class="input-large"
               minlength="4" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email"
               type="email"
               [(ngModel)]="data.email"
               name="email"
               required
               placeholder="tu@email.com"
               class="input-large" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password"
               type="password"
               [(ngModel)]="data.password"
               name="password"
               required
               placeholder="Mínimo 6 caracteres"
               class="input-large"
               minlength="6" />
      </div>

      <button type="submit"
              class="btn-primary btn-full"
              [disabled]="loading">
        {{ loading ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="auth-footer">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>

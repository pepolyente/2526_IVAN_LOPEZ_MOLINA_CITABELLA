<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <span class="login-logo">✂</span>
      <h1>CitaBella</h1>
      <p>Crea tu cuenta</p>
    </div>

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input id="username" type="text" [(ngModel)]="data.username"
               name="username" required placeholder="Nombre de usuario" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" [(ngModel)]="data.email"
               name="email" required placeholder="tu@email.com" />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" [(ngModel)]="data.password"
               name="password" required placeholder="Mínimo 8 caracteres" />
      </div>

      @if (error) {
        <p class="error-msg">{{ error }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Registrando...' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="login-footer">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>

<header class="header">
  <div class="header-brand">
    <span class="header-title">CitaBella</span>
  </div>
  <nav class="header-nav">
    @if (auth.hasRole('ADMIN', 'EMPLOYEE')) {
      <a routerLink="/panel/appointments" routerLinkActive="active">Agenda</a>
      <a routerLink="/panel/clients" routerLinkActive="active">Clientes</a>
    }
    @if (auth.hasRole('ADMIN')) {
      <a routerLink="/panel/employees" routerLinkActive="active">Empleados</a>
      <a routerLink="/panel/treatments" routerLinkActive="active">Tratamientos</a>
      <a routerLink="/panel/admin/users" routerLinkActive="active">Usuarios</a>
    }
    @if (auth.hasRole('CLIENT')) {
      <a routerLink="/panel/my-appointments" routerLinkActive="active">Mis citas</a>
    }
  </nav>
  <div class="header-right">
    <span class="header-user">{{ auth.getUsername() }}</span>
    <button class="btn-logout" (click)="logout()">Cerrar Sesión</button>
  </div>
</header>

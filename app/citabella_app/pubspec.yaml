name: citabella_app
description: "CitaBella — Contenedor nativo Flutter para Angular SPA vía Nginx + Spring Boot"
publish_to: 'none'
version: 1.0.0+1

# ─── Entorno Dart / Flutter ────────────────────────────────────────────────
environment:
  sdk: '>=3.3.0 <4.0.0'

# ─── Dependencias de producción ────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  # WebView avanzado — OBLIGATORIO, NO usar webview_flutter
  flutter_inappwebview: ^6.1.5

  # Detección de conectividad (wifi / mobile / none)
  connectivity_plus: ^6.1.1

  # Gestión de estado simple y robusta
  provider: ^6.1.2

# ─── Dependencias de desarrollo ────────────────────────────────────────────
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.14.4"

  # Splash screen nativo (genera recursos nativos Android/iOS)
  flutter_native_splash: ^2.4.3

# ─── Configuración Flutter ─────────────────────────────────────────────────
flutter:
  uses-material-design: true

  # Assets del proyecto
  assets:
    - assets/images/
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_splash_dark.png"
  # NOTA: No se define fuente Inter aquí porque Angular la carga desde Google Fonts
  # dentro del WebView. Flutter solo usa la fuente nativa del sistema.
